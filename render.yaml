# One-click deploy: https://dashboard.render.com → New → Blueprint → this repo
# Set root directory to repository root (this file is at repo root).
services:
  - type: web
    name: apex-trading-backend
    runtime: docker
    rootDir: trading-platform
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: trading-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PAPER_TRADING_ONLY
        value: "true"
      - key: INITIAL_BALANCE
        value: "100000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/trading.db
      - key: CORS_ORIGINS
        value: "https://apex-trading-dashboard-flame.vercel.app,https://apex-trading-dashboard-apexweb-adams-projects.vercel.app"
      - key: NEWSAPI_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: POLYMARKET_WALLET_ADDRESS
        sync: false
