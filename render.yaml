# One-click deploy: https://dashboard.render.com → New → Blueprint → this repo
# Database: Supabase Postgres (free tier — no Render disk needed)
# autoDeployTrigger: commit — deploy on every main push (not checksPass; Vercel CI failures block checksPass)
services:
  - type: web
    name: apex-trading-backend
    runtime: docker
    repo: https://github.com/apexweb-adam/apexweb-adam
    branch: main
    rootDir: trading-platform
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: PAPER_TRADING_ONLY
        value: "true"
      - key: INITIAL_BALANCE
        value: "100000"
