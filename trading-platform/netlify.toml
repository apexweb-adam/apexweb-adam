# Legacy — platform deploys via Render (backend) + Vercel (dashboard GitHub Actions).
# Skip all Netlify builds so the GitHub App reports success instead of stuck queued.
[build]
  base = "trading-platform/dashboard"
  command = "npm run build"
  publish = "trading-platform/dashboard/.next"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "20"
