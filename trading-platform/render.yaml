services:
  - type: web
    name: apex-trading-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PAPER_TRADING_ONLY
        value: "true"
      - key: INITIAL_BALANCE
        value: "100000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/trading.db
      - key: CORS_ORIGINS
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
