# Render Blueprint — use Supabase for persistence (free tier has no disk support)
# Canonical copy: repo root render.yaml (keep in sync)
services:
  - type: web
    name: apex-trading-backend
    runtime: docker
    rootDir: trading-platform
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PAPER_TRADING_ONLY
        value: "true"
      - key: INITIAL_BALANCE
        value: "100000"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://apex-trading-dashboard-flame.vercel.app,https://apex-trading-dashboard-apexweb-adams-projects.vercel.app,https://apex-trading-dashboard-fvmoq5oyj-apexweb-adams-projects.vercel.app"
      - key: VERIFIED_DASHBOARD_URL
        value: "https://apex-trading-dashboard-fvmoq5oyj-apexweb-adams-projects.vercel.app"
      - key: VERIFIED_VERCEL_DEPLOYMENT_ID
        value: "dpl_8xcr2CHLWNyDHpHo5cSLsZn3YaU5"
      - key: VERIFIED_DASHBOARD_FALLBACKS
        value: "https://apex-trading-dashboard-fvmoq5oyj-apexweb-adams-projects.vercel.app,https://apex-trading-dashboard-apexweb-adams-projects.vercel.app"
      - key: NEWSAPI_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
      - key: POLYMARKET_API_KEY
        sync: false
      - key: POLYMARKET_WALLET_ADDRESS
        sync: false
      - key: POLYMARKET_DEPOSIT_ADDRESS
        sync: false
      - key: RENDER_DEPLOY_HOOK
        sync: false
      - key: PLATFORM_REVISION
        value: "2026-08-27-r19"
