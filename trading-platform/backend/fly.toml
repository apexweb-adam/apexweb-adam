# fly.toml — deploy from trading-platform/backend/
# Use Supabase for DATABASE_URL (see SUPABASE_SETUP.md) — no volume needed
# fly launch --name apex-trading-backend --region iad --no-deploy
# fly secrets set DATABASE_URL="postgresql+asyncpg://..."
# fly deploy

app = "apex-trading-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PAPER_TRADING_ONLY = "true"
  INITIAL_BALANCE = "100000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
