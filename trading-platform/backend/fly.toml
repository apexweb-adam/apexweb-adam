# fly.toml — deploy from trading-platform/backend/
# fly launch --name apex-trading-backend --region iad --no-deploy
# fly volumes create trading_data --size 1 --region iad
# fly secrets import < .env.production
# fly deploy

app = "apex-trading-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PAPER_TRADING_ONLY = "true"
  INITIAL_BALANCE = "100000"
  DATABASE_URL = "sqlite+aiosqlite:///./data/trading.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "10s"

[mounts]
  source = "trading_data"
  destination = "/app/data"
