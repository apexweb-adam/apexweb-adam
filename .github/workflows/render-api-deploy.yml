name: Render API Deploy

on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: Clear build cache before deploy
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
    paths:
      - 'trading-platform/backend/**'
      - 'render.yaml'

jobs:
  trigger-render-api:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      CLEAR_CACHE: ${{ inputs.clear_cache || 'false' }}
    steps:
      - name: Trigger Render deploy
        run: |
          set -euo pipefail
          if [ -n "${RENDER_API_KEY:-}" ]; then
            SERVICES=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services?limit=100")
            SERVICE_ID=$(echo "$SERVICES" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for item in data:
              svc = item.get('service') or item
              if svc.get('name') == 'apex-trading-backend':
                  print(svc['id'])
                  break
          ")
            if [[ -z "$SERVICE_ID" ]]; then
              echo "Service apex-trading-backend not found. Deploy via Render Blueprint first." >&2
              exit 1
            fi
            BODY='{"clearCache":"clear"}'
            if [[ "$CLEAR_CACHE" != "true" ]]; then
              BODY='{}'
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys"
            echo "Deploy triggered for apex-trading-backend via API (preferred)"
          elif [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then
            LATEST=$(curl -fsS "https://api.github.com/repos/apexweb-adam/apexweb-adam/git/ref/heads/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'][:12])")
            DEPLOYED=$(curl -fsS "https://apex-trading-backend.onrender.com/api/status" | python3 -c "import json,sys; print(json.load(sys.stdin).get('deploy',{}).get('git_commit','')[:12])")
            if [[ -n "$DEPLOYED" && -n "$LATEST" && "$DEPLOYED" != "$LATEST" ]]; then
              echo "::warning::Backend stale — deployed $DEPLOYED, main is $LATEST. Skipping deploy hook."
            else
              curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
              echo "Triggered RENDER_DEPLOY_HOOK (current deploy only)"
            fi
          else
            echo "::warning::RENDER_API_KEY and RENDER_DEPLOY_HOOK are not set — cannot trigger Render deploy from CI."
            echo "Render Blueprint autoDeploy may still deploy from GitHub pushes."
            echo "Verify: https://apex-trading-backend.onrender.com/api/status (deploy.git_commit vs latest_main_commit)"
            echo "Manual deploy: Render Dashboard → apex-trading-backend → Manual Deploy"
            echo "Or add Deploy Hook URL to GitHub secret RENDER_DEPLOY_HOOK (see trading-platform/RENDER_DEPLOY.md)"
          fi

      - name: Print service URL
        run: |
          if [ -z "${RENDER_API_KEY:-}" ]; then
            exit 0
          fi
          SERVICES=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=100")
          SERVICE_ID=$(echo "$SERVICES" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for item in data:
              svc = item.get('service') or item
              if svc.get('name') == 'apex-trading-backend':
                  print(svc['id'])
                  break
          ")
          SVC=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/${SERVICE_ID}")
          URL=$(echo "$SVC" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('serviceDetails',{}).get('url','') or d.get('service',{}).get('serviceDetails',{}).get('url',''))")
          echo "Backend URL: $URL"
          echo "Set Vercel BACKEND_URL=$URL and BACKEND_WS_URL=${URL/https/wss}"
