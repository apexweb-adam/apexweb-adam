name: Platform Health Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check production dashboard bundle and proxy
        env:
          VERIFIED_PREVIEW: "https://apex-trading-dashboard-edv5hefqa-apexweb-adams-projects.vercel.app"
        run: |
          set -euo pipefail
          DASHBOARD="https://apex-trading-dashboard-flame.vercel.app"
          curl -fsS "$DASHBOARD/api/config" -o /tmp/dash-config.json || echo "{}" > /tmp/dash-config.json
          python3 << 'PY'
          import json, os
          with open("/tmp/dash-config.json") as f:
              cfg = json.load(f)
          expected = "2026-08-27-r13"
          current = (
              cfg.get("bundleRevision") == expected
              and (cfg.get("features") or {}).get("activeGate") is True
          )
          if current:
              print(f"Production dashboard bundle OK ({expected})")
          else:
              preview = os.environ.get("VERIFIED_PREVIEW", "")
              print(f"::warning::Production Vercel bundle stale (rev={cfg.get('bundleRevision')!r})")
              print(f"::warning::Use verified preview until promote: {preview}")
              print("::warning::Promote dpl_AtSLEsY1fkNDvA9ZDdycLB5BANf8 or add VERCEL_TOKEN secret")
          PY
          echo "Checking $DASHBOARD/api/config ..."
          curl -fsS "$DASHBOARD/api/config" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('apiUrl'), 'missing apiUrl'"
          echo "Checking $DASHBOARD/api/backend/stats ..."
          STATS=$(curl -fsS "$DASHBOARD/api/backend/stats")
          echo "$STATS" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('mode')=='paper_trading', d
          assert d.get('bots_active')==4, d
          print('OK: equity=%s pnl=%s trades=%s intel=%s' % (
            d.get('total_equity'), d.get('total_pnl'), d.get('total_trades'), d.get('intelligence_items')))
          "

      - name: Check backend deploy is current
        run: |
          LATEST=$(curl -fsS "https://api.github.com/repos/apexweb-adam/apexweb-adam/commits/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'][:12])")
          DEPLOYED=$(curl -fsS "https://apex-trading-backend.onrender.com/api/status" | python3 -c "import json,sys; d=json.load(sys.stdin).get('deploy',{}); print((d.get('git_commit') or '?')[:12])")
          echo "main=$LATEST deployed=$DEPLOYED"
          if [[ "$DEPLOYED" != "$LATEST" && "$DEPLOYED" != "${LATEST:0:12}" ]]; then
            echo "::warning::Render backend stale — deployed $DEPLOYED, main is $LATEST. Trigger manual deploy."
          else
            echo "Backend deploy matches main ($DEPLOYED)"
          fi

      - name: Check CRM landing page (/crm)
        run: |
          set -euo pipefail
          CRM=$(curl -fsS "https://apex-trading-backend.onrender.com/crm")
          echo "$CRM" | python3 -c "
          import sys
          html = sys.stdin.read()
          assert 'Apex Trading CRM' in html, 'missing CRM title'
          assert 'dashboard' in html.lower(), 'missing dashboard link'
          if 'verification gate' in html.lower():
              print('OK: CRM landing shows verification gate stats')
          else:
              print('::warning::CRM landing is legacy redirect-only — backend deploy may be stale (PR #76+)')
          "

      - name: Check backend status endpoint (via proxy)
        run: |
          curl -fsS "https://apex-trading-dashboard-flame.vercel.app/api/backend/status" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('paper_trading_only') is True
          assert d['intelligence']['active_sources'] >= 10
          sched = d.get('scheduler', {})
          assert sched.get('risk_migration') == 'every 15 min', sched
          print('Platform status OK:', d.get('platform'), 'sources:', d['intelligence']['active_sources'])
          print('Scheduler:', sched)
          "

      - name: Check active-bot gate endpoint (production proxy)
        env:
          VERIFIED_PREVIEW: "https://apex-trading-dashboard-edv5hefqa-apexweb-adams-projects.vercel.app"
        run: |
          set -euo pipefail
          PROD="https://apex-trading-dashboard-flame.vercel.app"
          GATE=$(curl -fsS -o /dev/null -w "%{http_code}" "$PROD/api/backend/active-gate" || echo "000")
          echo "Production /api/backend/active-gate HTTP $GATE"
          if [[ "$GATE" != "200" ]]; then
            echo "::error::Active-bot gate unavailable on production proxy"
            exit 1
          fi
          curl -fsS "$PROD/api/backend/active-gate" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('active_bots'), d
          a=d['active_bots']
          print('OK: %s trades WR %.1f%% PF %s PnL $%.2f' % (
            a.get('total_trades'), (a.get('win_rate') or 0)*100,
            a.get('profit_factor'), a.get('total_pnl') or 0))
          "
          NATIVE=$(curl -fsS -o /dev/null -w "%{http_code}" "$PROD/api/active-gate" || echo "000")
          PREVIEW="${VERIFIED_PREVIEW}"
          if [[ "$NATIVE" != "200" ]]; then
            echo "::warning::Production /api/active-gate is $NATIVE — promote dpl_AtSLEsY1fkNDvA9ZDdycLB5BANf8"
            PREVIEW_NATIVE=$(curl -fsS -o /dev/null -w "%{http_code}" "$PREVIEW/api/active-gate" || echo "000")
            echo "Verified preview /api/active-gate HTTP $PREVIEW_NATIVE ($PREVIEW)"
            if [[ "$PREVIEW_NATIVE" != "200" ]]; then
              echo "::error::Verified preview native active-gate also unavailable"
              exit 1
            fi
          fi

      - name: Check equity-history endpoint (verification chart fallback)
        run: |
          set -euo pipefail
          for base in "https://apex-trading-backend.onrender.com" "https://apex-trading-dashboard-flame.vercel.app/api/backend"; do
            CODE=$(curl -sS -o /tmp/equity.json -w "%{http_code}" "$base/equity-history" || echo "000")
            echo "$base/equity-history HTTP $CODE"
            if [[ "$CODE" == "200" ]]; then
              python3 -c "import json; d=json.load(open('/tmp/equity.json')); print('OK: %s day(s) of equity history' % len(d))"
              exit 0
            fi
          done
          echo "::warning::equity-history unavailable — backend deploy may be stale (PR #60+)"

      - name: Check active-bot profitability gate (excludes paused bots)
        run: python3 trading-platform/scripts/active-bot-gate.py

      - name: Check profitability verification gate
        run: |
          curl -fsS "https://apex-trading-dashboard-flame.vercel.app/api/backend/profitability" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('paper_trading_only') is True, 'paper_trading_only must stay enabled'
          assert d.get('live_trading_ready') is False, 'live trading must remain disabled during verification'
          checks = d.get('checks', {})
          wr = checks.get('min_win_rate', {})
          pf = checks.get('min_profit_factor', {})
          trades = checks.get('min_trades', {})
          days = checks.get('min_days', {})
          pnl = checks.get('positive_pnl', {})
          print('Verification day %s of 30 | trades %s/%s | WR %.1f%% | PF %s | PnL $%.2f' % (
            d.get('verification_day', '?'),
            trades.get('actual'), trades.get('required'),
            (wr.get('actual') or 0) * 100,
            pf.get('actual'),
            pnl.get('actual') or 0,
          ))
          print('Recommendation:', d.get('recommendation'))
          for key in ('min_win_rate', 'min_profit_factor', 'positive_pnl', 'paper_trading_only'):
            c = checks.get(key, {})
            if not c.get('passed'):
              print('::warning::Profitability check failed: %s (required=%s actual=%s)' % (
                key, c.get('required'), c.get('actual')))
          deploy = json.loads(__import__('subprocess').check_output(
            ['curl', '-fsS', 'https://apex-trading-backend.onrender.com/api/status'],
            text=True,
          )).get('deploy', {})
          if deploy.get('is_stale'):
            print('::warning::Backend deploy stale (%s min behind main)' % deploy.get('stale_minutes'))
          "
