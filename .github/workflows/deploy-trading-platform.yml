name: Deploy Trading Platform

on:
  push:
    branches: [main, cursor/apex-trading-platform-f603]
    paths:
      - 'trading-platform/**'
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trading-platform/dashboard/package-lock.json
      - name: Install and build dashboard
        working-directory: trading-platform/dashboard
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.TRADING_API_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_WS_URL: ${{ vars.TRADING_WS_URL || 'ws://localhost:8000' }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: trading-platform/dashboard
          vercel-args: '--prod'
