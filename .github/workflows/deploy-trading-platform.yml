name: Deploy Trading Platform

on:
  push:
    branches: [main, cursor/apex-trading-platform-f603]
    paths:
      - 'trading-platform/dashboard/**'
      - 'vercel.json'
      - '.github/workflows/deploy-trading-platform.yml'
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_K7OUE7uroVXeVUf42cUAQvAl' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_HGbG5vHgfutHi31QfXDqSsTnTAGv' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trading-platform/dashboard/package-lock.json

      - name: Install and build dashboard
        working-directory: trading-platform/dashboard
        run: |
          npm ci
          npm run build
        env:
          BACKEND_URL: ${{ vars.TRADING_API_URL || 'https://apex-trading-backend.onrender.com' }}
          BACKEND_WS_URL: ${{ vars.TRADING_WS_URL || 'wss://apex-trading-backend.onrender.com' }}

      - name: Deploy to Vercel
        id: vercel_deploy
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            npx vercel@latest deploy --prod \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --yes > /tmp/vercel-deploy.log 2>&1
            cat /tmp/vercel-deploy.log
            PREVIEW_URL=$(grep -oE 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.log | tail -1)
            echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            echo "Deployed to production via VERCEL_TOKEN: $PREVIEW_URL"
          elif [ -n "${VERCEL_DEPLOY_HOOK:-}" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Triggered VERCEL_DEPLOY_HOOK for production"
          else
            echo "::warning::Neither VERCEL_TOKEN nor VERCEL_DEPLOY_HOOK is set — production dashboard may stay stale."
            echo "Add GitHub secrets (repo Settings → Secrets):"
            echo "  VERCEL_TOKEN — from https://vercel.com/account/tokens"
            echo "  VERCEL_ORG_ID — team_K7OUE7uroVXeVUf42cUAQvAl (or set as repo variable)"
            echo "  VERCEL_PROJECT_ID — prj_HGbG5vHgfutHi31QfXDqSsTnTAGv"
            echo "Or create a Deploy Hook in Vercel → apex-trading-dashboard → Settings → Git → Deploy Hooks (branch: main)"
            echo "  and add the hook URL as VERCEL_DEPLOY_HOOK"
            echo "Manual promote: Vercel dashboard → Deployments → latest main → Promote to Production"
            echo "Live URL: https://apex-trading-dashboard-flame.vercel.app"
          fi

      - name: Verify production dashboard bundle
        if: always()
        env:
          EXPECTED_BUNDLE_REVISION: "2026-08-29-r37"
        run: |
          set -euo pipefail
          PROD="https://apex-trading-dashboard-flame.vercel.app"
          MAIN=$(curl -fsS "https://api.github.com/repos/apexweb-adam/apexweb-adam/commits/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'][:12])")
          curl -fsS "$PROD/api/config" -o /tmp/prod-config.json || echo "{}" > /tmp/prod-config.json
          echo "main=$MAIN config=$(cat /tmp/prod-config.json)"
          python3 << 'PY'
          import json, os, sys
          with open("/tmp/prod-config.json") as f:
              cfg = json.load(f)
          expected = os.environ.get("EXPECTED_BUNDLE_REVISION", "2026-08-27-r11")
          ok = (
              cfg.get("bundleRevision") == expected
              and (cfg.get("features") or {}).get("activeGate") is True
          )
          if ok:
              print("Production bundle current:", expected)
              sys.exit(0)
          print("::warning::Production dashboard stale — missing bundleRevision/features.activeGate")
          print("Promote dpl_GQTTm469KGGRkiKfwrULaLieM5VE or add VERCEL_TOKEN")
          print("Verified preview: https://apex-trading-dashboard-4am3sz5kv-apexweb-adams-projects.vercel.app")
          sys.exit(0)
          PY
