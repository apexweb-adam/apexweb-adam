name: Deploy Trading Platform

on:
  push:
    branches: [main, cursor/apex-trading-platform-f603]
    paths:
      - 'trading-platform/dashboard/**'
      - '.github/workflows/deploy-trading-platform.yml'
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_K7OUE7uroVXeVUf42cUAQvAl' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_HGbG5vHgfutHi31QfXDqSsTnTAGv' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trading-platform/dashboard/package-lock.json

      - name: Install and build dashboard
        working-directory: trading-platform/dashboard
        run: |
          npm ci
          npm run build
        env:
          BACKEND_URL: ${{ vars.TRADING_API_URL || 'https://apex-trading-backend.onrender.com' }}
          BACKEND_WS_URL: ${{ vars.TRADING_WS_URL || 'wss://apex-trading-backend.onrender.com' }}

      - name: Deploy to Vercel (API token)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          working-directory: trading-platform/dashboard
          vercel-args: '--prod'

      - name: Deploy to Vercel (deploy hook)
        if: ${{ secrets.VERCEL_TOKEN == '' && secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "Triggered VERCEL_DEPLOY_HOOK for production"

      - name: Deploy credentials missing
        if: ${{ secrets.VERCEL_TOKEN == '' && secrets.VERCEL_DEPLOY_HOOK == '' }}
        run: |
          echo "::warning::Neither VERCEL_TOKEN nor VERCEL_DEPLOY_HOOK is set — production dashboard may stay stale."
          echo "Add GitHub secrets (repo Settings → Secrets):"
          echo "  VERCEL_TOKEN — from https://vercel.com/account/tokens"
          echo "  VERCEL_ORG_ID — team_K7OUE7uroVXeVUf42cUAQvAl (or set as repo variable)"
          echo "  VERCEL_PROJECT_ID — prj_HGbG5vHgfutHi31QfXDqSsTnTAGv"
          echo "Or create a Deploy Hook in Vercel → apex-trading-dashboard → Settings → Git → Deploy Hooks (branch: main)"
          echo "  and add the hook URL as VERCEL_DEPLOY_HOOK"
          echo "Manual promote: Vercel dashboard → Deployments → latest main → Promote to Production"
          echo "Live URL: https://apex-trading-dashboard-flame.vercel.app"

      - name: Verify production dashboard bundle
        if: always()
        run: |
          set -euo pipefail
          MAIN=$(curl -fsS "https://api.github.com/repos/apexweb-adam/apexweb-adam/commits/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'][:12])")
          PAGE=$(curl -fsS "https://apex-trading-dashboard-flame.vercel.app/")
          echo "main=$MAIN"
          if echo "$PAGE" | grep -q "excludes paused"; then
            echo "Production has active-bot profitability gate"
          else
            echo "::warning::Production dashboard missing client-side gate (PR #48+) — promote latest main in Vercel"
          fi
