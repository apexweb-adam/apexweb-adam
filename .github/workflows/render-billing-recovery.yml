name: Render Billing Recovery

# When billing suspension clears, run full platform recovery (deploy verify + post-open checks).
on:
  schedule:
    - cron: "*/15 * * * *"
    # Monday US session catch-up (13:30–21:00 UTC): poll every 5 min through cash close
    - cron: "*/5 13-21 * * 1"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover after billing suspension
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}/trading-platform"
          # shellcheck source=lib/fetch_json.sh
          source "$ROOT/scripts/lib/fetch_json.sh"
          URL="https://apex-trading-backend.onrender.com"

          GRACE_LEFT="$(python3 - << 'PY' 2>/dev/null || true
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          if now.isoweekday() != 1:
              raise SystemExit(0)
          open_at = now.replace(hour=13, minute=30, second=0, microsecond=0)
          ext_left = max(0, int((open_at.timestamp() + 270 * 60 - now.timestamp()) // 60))
          if ext_left > 0:
              print(ext_left)
          PY
          )"

          POST_GRACE_US_SESSION="$(python3 - << 'PY' 2>/dev/null || true
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          if now.isoweekday() != 1 or now.hour < 13 or now.hour >= 21:
              raise SystemExit(0)
          open_at = now.replace(hour=13, minute=30, second=0, microsecond=0)
          if now.timestamp() < open_at.timestamp():
              raise SystemExit(0)
          ext_left = max(0, int((open_at.timestamp() + 270 * 60 - now.timestamp()) // 60))
          if ext_left == 0:
              print("post_grace")
          PY
          )"

          if check_backend_suspension "$URL"; then
            echo "Backend online — running recovery chain"
            WAIT=600
            POLL=20
          elif [[ -n "$GRACE_LEFT" && "$GRACE_LEFT" -gt 0 ]]; then
            bash "$ROOT/scripts/print-outage-status.sh" || true
            echo "Monday outage grace active (${GRACE_LEFT} min left) — waiting for billing resume"
            WAIT=1200
            POLL=10
          elif [[ -n "$POST_GRACE_US_SESSION" ]]; then
            bash "$ROOT/scripts/print-outage-status.sh" || true
            echo "Monday post-grace US session — waiting for billing resume (forced open-ready scan on r467+)"
            WAIT=1200
            POLL=15
          else
            bash "$ROOT/scripts/print-outage-status.sh" || true
            echo "::error::Render backend billing-suspended — fix at https://dashboard.render.com/web/srv-da848ms9v7es739k38jg"
            exit 1
          fi

          VERIFY_ONCE=1 bash "$ROOT/scripts/recover-render-billing.sh" --wait "$WAIT" --interval "$POLL" --verify-once
