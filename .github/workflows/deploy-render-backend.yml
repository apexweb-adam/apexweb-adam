name: Deploy Backend to Render

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"
  push:
    branches: [main]
    paths:
      - 'trading-platform/backend/**'
      - 'render.yaml'
      - 'trading-platform/render.yaml'

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Skip if backend already matches main (scheduled runs only)
        if: github.event_name == 'schedule'
        id: freshness
        run: |
          set -euo pipefail
          LATEST=$(curl -fsS "https://api.github.com/repos/apexweb-adam/apexweb-adam/git/ref/heads/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'][:12])")
          DEPLOYED=$(curl -fsS "https://apex-trading-backend.onrender.com/api/status" | python3 -c "import json,sys; d=json.load(sys.stdin).get('deploy',{}); print((d.get('git_commit') or '?')[:12])")
          EQUITY=$(curl -s -o /dev/null -w "%{http_code}" "https://apex-trading-backend.onrender.com/api/equity-history")
          echo "main=$LATEST deployed=$DEPLOYED equity_history=$EQUITY"
          if [[ "$DEPLOYED" == "$LATEST" && "$EQUITY" == "200" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Backend current — skipping scheduled deploy trigger"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Backend stale or missing endpoints — will trigger deploy"
          fi

      - name: Trigger Render deploy
        if: github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${RENDER_API_KEY:-}" ]; then
            SERVICES=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services?limit=100")
            SERVICE_ID=$(echo "$SERVICES" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for item in data:
              svc = item.get('service') or item
              if svc.get('name') == 'apex-trading-backend':
                  print(svc['id'])
                  break
          ")
            if [[ -z "$SERVICE_ID" ]]; then
              echo "Service apex-trading-backend not found." >&2
              exit 1
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"clear"}' \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys"
            echo "Deploy triggered via Render API (preferred — pulls latest GitHub commit)"
          else
            STATUS=$(curl -fsS "https://apex-trading-backend.onrender.com/api/status")
            STALE=$(echo "$STATUS" | python3 -c "import json,sys; d=json.load(sys.stdin).get('deploy',{}); print('true' if d.get('is_stale') or int(d.get('commits_behind') or 0)>0 else 'false')")
            if [[ "$STALE" == "true" ]]; then
              echo "::warning::Backend is stale — skipping RENDER_DEPLOY_HOOK (redeploys old commit)."
              echo "This push should trigger Render autoDeploy from GitHub. If still stale after 10 min:"
              echo "  Render Dashboard → apex-trading-backend → Manual Deploy → latest commit"
              echo "Or add RENDER_API_KEY to GitHub secrets for CI deploys with cache clear."
            elif [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then
              curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
              echo "Triggered RENDER_DEPLOY_HOOK (current deploy — safe to redeploy same commit)"
            else
              echo "::warning::Neither RENDER_DEPLOY_HOOK nor RENDER_API_KEY is set."
              echo "Render Blueprint autoDeploy from GitHub may still deploy — verify:"
              echo "  https://apex-trading-backend.onrender.com/api/status (deploy.git_commit vs latest_main_commit)"
            fi
          fi

      - name: Verify production picked up backend deploy
        if: always() && (github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true')
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            sleep 30
            STATUS=$(curl -fsS "https://apex-trading-backend.onrender.com/api/status")
            DEPLOYED=$(echo "$STATUS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('deploy',{}).get('git_commit','')[:12])")
            MAIN=$(curl -fsS "https://api.github.com/repos/apexweb-adam/apexweb-adam/git/ref/heads/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'][:12])")
            EQUITY=$(curl -s -o /dev/null -w "%{http_code}" "https://apex-trading-backend.onrender.com/api/equity-history")
            echo "attempt $attempt: deployed=$DEPLOYED main=$MAIN equity_history=$EQUITY"
            if [[ "$DEPLOYED" == "$MAIN" && "$EQUITY" == "200" ]]; then
              echo "Backend deploy verified"
              exit 0
            fi
          done
          VERIFY=$(curl -s -o /dev/null -w "%{http_code}" "https://apex-trading-backend.onrender.com/api/verification/history")
          echo "deployed=$DEPLOYED main=$MAIN verification_history=$VERIFY equity_history=$EQUITY"
          if [[ "$DEPLOYED" != "$MAIN" ]]; then
            echo "::warning::Render still on $DEPLOYED — main is $MAIN. Manual deploy: Render → Manual Deploy → latest commit."
          fi
          if [[ "$EQUITY" != "200" ]]; then
            echo "::warning::Equity history endpoint HTTP $EQUITY — deploy hook may have redeployed old commit; fix GitHub sync on Render."
          fi
