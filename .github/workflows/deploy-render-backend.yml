name: Deploy Backend to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading-platform/backend/**'
      - 'render.yaml'
      - 'trading-platform/render.yaml'

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Deploy hook not configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK == '' && secrets.RENDER_API_KEY == '' }}
        run: |
          echo "::warning::Neither RENDER_DEPLOY_HOOK nor RENDER_API_KEY is set."
          echo "Render Blueprint autoDeploy from GitHub may still deploy — verify:"
          echo "  https://apex-trading-backend.onrender.com/api/status (deploy.git_commit vs latest_main_commit)"
          echo "Add Deploy Hook URL from Render → Settings → Deploy Hook to repo secrets."

      - name: Verify production picked up backend deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK == '' && secrets.RENDER_API_KEY == '' }}
        run: |
          set -euo pipefail
          sleep 15
          STATUS=$(curl -fsS "https://apex-trading-backend.onrender.com/api/status")
          DEPLOYED=$(echo "$STATUS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('deploy',{}).get('git_commit','')[:12])")
          MAIN=$(curl -fsS "https://api.github.com/repos/apexweb-adam/apexweb-adam/commits/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'][:12])")
          VERIFY=$(curl -s -o /dev/null -w "%{http_code}" "https://apex-trading-backend.onrender.com/api/verification/history")
          echo "deployed=$DEPLOYED main=$MAIN verification_history=$VERIFY"
          if [[ "$DEPLOYED" != "$MAIN" ]]; then
            echo "::warning::Render still on $DEPLOYED — main is $MAIN. Manual deploy required in Render dashboard."
          fi
          if [[ "$VERIFY" != "200" ]]; then
            echo "::warning::Verification snapshot endpoint HTTP $VERIFY — latest backend not live yet."
          fi

  trigger-render-api:
    if: ${{ secrets.RENDER_DEPLOY_HOOK == '' && secrets.RENDER_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find apex-trading-backend service
        id: find
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SERVICES=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=100")
          SERVICE_ID=$(echo "$SERVICES" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for item in data:
              svc = item.get('service') or item
              if svc.get('name') == 'apex-trading-backend':
                  print(svc['id'])
                  break
          ")
          if [[ -z "$SERVICE_ID" ]]; then
            echo "Service apex-trading-backend not found." >&2
            exit 1
          fi
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy via Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{}" \
            "https://api.render.com/v1/services/${{ steps.find.outputs.service_id }}/deploys"
          echo "Deploy triggered via Render API"
