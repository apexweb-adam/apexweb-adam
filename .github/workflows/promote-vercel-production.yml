name: Promote Vercel Dashboard to Production

# Promotes a validated preview deployment to production without rebuilding.
# Requires VERCEL_TOKEN in GitHub secrets.

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Vercel deployment ID (empty = auto-discover or use latest verified)
        required: false
        default: ""
      preview_url:
        description: Preview URL to verify (empty = auto-discover or use latest verified)
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - 'trading-platform/dashboard/**'
      - 'trading-platform/render.yaml'
      - 'render.yaml'
      - 'trading-platform/backend/app/engines/deploy_status.py'
      - 'trading-platform/scripts/promote-vercel-dashboard.sh'
      - '.github/workflows/promote-vercel-production.yml'

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_K7OUE7uroVXeVUf42cUAQvAl' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_HGbG5vHgfutHi31QfXDqSsTnTAGv' }}
      EXPECTED_BUNDLE_REVISION: "2026-08-29-r95"
      ACCEPTABLE_BUNDLE_REVISIONS: "2026-08-29-r95,2026-08-29-r94,2026-08-29-r93,2026-08-29-r92,2026-08-29-r91,2026-08-29-r90,2026-08-29-r89,2026-08-29-r88,2026-08-29-r87,2026-08-29-r86,2026-08-29-r85,2026-08-29-r84,2026-08-29-r83,2026-08-29-r82,2026-08-29-r81,2026-08-29-r80,2026-08-29-r79,2026-08-29-r78,2026-08-29-r77,2026-08-29-r76,2026-08-29-r75,2026-08-29-r74,2026-08-29-r73,2026-08-29-r72,2026-08-29-r71,2026-08-29-r70,2026-08-29-r69,2026-08-29-r68,2026-08-29-r67,2026-08-29-r66"
    steps:
      - name: Skip if production already current
        id: freshness
        run: |
          set -euo pipefail
          PROD_URL="https://apex-trading-dashboard-flame.vercel.app"
          curl -fsS "${PROD_URL}/api/config" -o /tmp/prod-config.json || echo "{}" > /tmp/prod-config.json
          cat /tmp/prod-config.json
          python3 << 'PY'
          import json, os
          with open("/tmp/prod-config.json") as f:
              cfg = json.load(f)
          expected = os.environ.get("EXPECTED_BUNDLE_REVISION", "2026-08-27-r11")
          acceptable = {
              b.strip()
              for b in os.environ.get("ACCEPTABLE_BUNDLE_REVISIONS", expected).split(",")
              if b.strip()
          }
          rev = cfg.get("bundleRevision")
          features = cfg.get("features") or {}
          active_gate = features.get("activeGate") is True
          current = rev in acceptable and active_gate
          print(f"bundleRevision={rev!r} acceptable={sorted(acceptable)!r} activeGate={active_gate}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"skip={'true' if current else 'false'}\n")
          PY

      - name: Resolve preview deployment
        if: steps.freshness.outputs.skip != 'true'
        id: resolve
        env:
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id || '' }}
          INPUT_PREVIEW_URL: ${{ inputs.preview_url || '' }}
        run: |
          set -euo pipefail
          FALLBACK_ID="dpl_3dNmumttz3SytQkzSaw11vFNUv2F"
          FALLBACK_URL="https://apex-trading-dashboard-43tumxweh-apexweb-adams-projects.vercel.app"
          if [[ -n "$INPUT_DEPLOYMENT_ID" && -n "$INPUT_PREVIEW_URL" ]]; then
            echo "deployment_id=$INPUT_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
            echo "preview_url=$INPUT_PREVIEW_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${VERCEL_TOKEN:-}" ]]; then
            curl -fsS \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=20" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" > /tmp/deployments.json
            python3 << 'PY'
          import json, os, urllib.request
          expected = os.environ.get("EXPECTED_BUNDLE_REVISION", "2026-08-27-r11")
          acceptable = [
              b.strip()
              for b in os.environ.get("ACCEPTABLE_BUNDLE_REVISIONS", expected).split(",")
              if b.strip()
          ]
          rank = {rev: idx for idx, rev in enumerate(reversed(acceptable))}
          with open("/tmp/deployments.json") as f:
              data = json.load(f)
          best = None
          best_score = -1
          for dep in data.get("deployments") or []:
              if dep.get("target") == "production" or dep.get("state") != "READY":
                  continue
              dep_id = dep.get("uid") or dep.get("id")
              url = f"https://{dep.get('url')}"
              try:
                  with urllib.request.urlopen(f"{url}/api/config", timeout=20) as resp:
                      cfg = json.loads(resp.read().decode())
                  rev = cfg.get("bundleRevision")
                  ok = rev in rank and (cfg.get("features") or {}).get("activeGate") is True
              except Exception:
                  ok = False
                  rev = None
              if ok and rank[rev] > best_score:
                  best_score = rank[rev]
                  best = (dep_id, url, rev)
          if best:
              dep_id, url, rev = best
              with open("/tmp/resolved.env", "w") as out:
                  out.write(f"deployment_id={dep_id}\n")
                  out.write(f"preview_url={url}\n")
              print(f"Auto-selected {dep_id} ({rev})")
          PY
            if [[ -f /tmp/resolved.env ]]; then
              source /tmp/resolved.env
              echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
              echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "deployment_id=$FALLBACK_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$FALLBACK_URL" >> "$GITHUB_OUTPUT"
          echo "Using verified fallback preview (PR #65)"

      - name: Promote deployment to production
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail
          DEPLOYMENT_ID="${{ steps.resolve.outputs.deployment_id }}"
          PREVIEW_URL="${{ steps.resolve.outputs.preview_url }}"
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::warning::VERCEL_TOKEN not set — promote manually in Vercel dashboard"
            echo "Preview: $PREVIEW_URL (deployment $DEPLOYMENT_ID)"
            exit 0
          fi
          GATE=$(curl -fsS -o /dev/null -w "%{http_code}" "${PREVIEW_URL}/api/active-gate" || echo "000")
          curl -fsS "${PREVIEW_URL}/api/config" -o /tmp/preview-config.json || echo "{}" > /tmp/preview-config.json
          echo "Preview active-gate=$GATE config=$(cat /tmp/preview-config.json)"
          python3 << 'PY'
          import json, os, sys
          with open("/tmp/preview-config.json") as f:
              cfg = json.load(f)
          expected = os.environ.get("EXPECTED_BUNDLE_REVISION", "2026-08-27-r11")
          acceptable = {
              b.strip()
              for b in os.environ.get("ACCEPTABLE_BUNDLE_REVISIONS", expected).split(",")
              if b.strip()
          }
          rev = cfg.get("bundleRevision")
          if rev not in acceptable:
              print(f"Preview bundleRevision not acceptable: {rev!r}")
              sys.exit(1)
          if not (cfg.get("features") or {}).get("activeGate"):
              print("Preview missing features.activeGate")
              sys.exit(1)
          PY
          HTTP=$(curl -fsS -o /tmp/promote.json -w "%{http_code}" -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOYMENT_ID}/aliases?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"alias":"apex-trading-dashboard-flame.vercel.app"}')
          echo "Alias API HTTP $HTTP"
          cat /tmp/promote.json
          if [[ "$HTTP" != "201" && "$HTTP" != "200" && "$HTTP" != "202" ]]; then
            HTTP=$(curl -fsS -o /tmp/promote.json -w "%{http_code}" -X POST \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Promote API HTTP $HTTP"
            cat /tmp/promote.json
          fi
          if [[ "$HTTP" != "201" && "$HTTP" != "200" && "$HTTP" != "202" ]]; then
            echo "::error::Vercel promote failed — may be rate limited (100 deploys/day on free tier)"
            exit 1
          fi
          sleep 15
          curl -fsS "https://apex-trading-dashboard-flame.vercel.app/api/config" -o /tmp/prod-config-after.json || echo "{}" > /tmp/prod-config-after.json
          cat /tmp/prod-config-after.json
          PROD_GATE=$(curl -fsS -o /dev/null -w "%{http_code}" "https://apex-trading-dashboard-flame.vercel.app/api/active-gate" || echo "000")
          echo "Production /api/active-gate HTTP $PROD_GATE"
          python3 << 'PY'
          import json, os, sys
          with open("/tmp/prod-config-after.json") as f:
              cfg = json.load(f)
          expected = os.environ.get("EXPECTED_BUNDLE_REVISION", "2026-08-27-r11")
          acceptable = {
              b.strip()
              for b in os.environ.get("ACCEPTABLE_BUNDLE_REVISIONS", expected).split(",")
              if b.strip()
          }
          ok = (
              cfg.get("bundleRevision") in acceptable
              and (cfg.get("features") or {}).get("activeGate") is True
          )
          if not ok:
              print(f"Production still stale: bundleRevision={cfg.get('bundleRevision')!r}")
          sys.exit(0 if ok else 1)
          PY
# Trigger workflow to promote r26 deployment
