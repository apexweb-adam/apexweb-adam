name: Render Keep-Alive

# Render free tier spins down after ~15 min idle — ping every 10 min so 24/7 bots stay running
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render backend
        run: |
          set -euo pipefail
          URL="https://apex-trading-backend.onrender.com"
          curl -fsS --max-time 30 "$URL/api/health" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('status')=='ok', d
          print('health OK', d.get('timestamp'))
          "
          # Light status pull keeps dashboard data fresh without heavy load
          curl -fsS --max-time 45 "$URL/api/stats" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('bots_active=%s trades=%s mode=%s' % (d.get('bots_active'), d.get('total_trades'), d.get('mode')))
          "

      - name: Check deploy staleness
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          URL="https://apex-trading-backend.onrender.com"
          curl -fsS --max-time 45 "$URL/api/status" -o /tmp/render-status.json
          python3 << 'PY'
          import json, os, sys, urllib.request
          with open("/tmp/render-status.json") as f:
              d = json.load(f)
          dep = d.get("deploy", {})
          stale = dep.get("is_stale")
          deployed = (dep.get("git_commit") or "")[:12]
          main = (dep.get("latest_main_commit") or "")[:12]
          print(f"deploy={deployed} main={main} stale={stale}")
          if not stale:
              sys.exit(0)
          hook = os.environ.get("RENDER_DEPLOY_HOOK", "").strip()
          api_key = os.environ.get("RENDER_API_KEY", "").strip()
          if hook:
              req = urllib.request.Request(hook, method="POST")
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("Triggered RENDER_DEPLOY_HOOK", resp.status)
              sys.exit(0)
          if api_key:
              req = urllib.request.Request(
                  "https://api.render.com/v1/services?limit=100",
                  headers={"Authorization": f"Bearer {api_key}"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  services = json.load(resp)
              service_id = None
              for item in services:
                  svc = item.get("service") or item
                  if svc.get("name") == "apex-trading-backend":
                      service_id = svc["id"]
                      break
              if not service_id:
                  print("::warning::apex-trading-backend not found in Render API")
                  sys.exit(0)
              req = urllib.request.Request(
                  f"https://api.render.com/v1/services/{service_id}/deploys",
                  data=b"{}",
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("Triggered Render API deploy", resp.status)
              sys.exit(0)
          print("::warning::Render deploy stale — set RENDER_DEPLOY_HOOK or RENDER_API_KEY in GitHub secrets")
          PY
